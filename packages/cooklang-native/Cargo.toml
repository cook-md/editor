[package]
name = "cooklang-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6", "serde-json", "tokio_rt"] }
napi-derive = "2"
cooklang = { version = "0.18.5", features = ["aisle", "pantry", "shopping_list"] }
cooklang-find = { version = "0.6.1", default-features = false }
cooklang-reports = "0.5"
camino = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
cooklang-language-server = { path = "../../../cooklang-language-server" }
cooklang-sync-client = "0.5"
chrono = "0.4"
cookmd-nutrition-client = { version = "0.1", optional = true }
cooklang-reports-nutrition = { version = "0.1", optional = true }

[features]
nutrition = ["dep:cookmd-nutrition-client", "dep:cooklang-reports-nutrition"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
