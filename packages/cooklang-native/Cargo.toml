[package]
name = "cooklang-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6", "serde-json", "tokio_rt"] }
napi-derive = "2"
cooklang = { version = "0.18.5", features = ["aisle", "pantry", "shopping_list"] }
cooklang-find = "0.5.8"
cooklang-reports = "0.5"
camino = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
cooklang-language-server = { path = "../../../cooklang-language-server" }
cooklang-sync-client = "0.5"
chrono = "0.4"
nutrition-client = { git = "ssh://git@github.com/cook-md/db", rev = "aeabf6af121c483a866f8e8f536a7a0e397ccb3d", optional = true }
nutrition-jinja  = { git = "ssh://git@github.com/cook-md/db", rev = "aeabf6af121c483a866f8e8f536a7a0e397ccb3d", optional = true }

[features]
nutrition = ["dep:nutrition-client", "dep:nutrition-jinja"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
