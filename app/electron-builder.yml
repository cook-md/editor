appId: md.cook.editor
productName: Cook Editor
copyright: Copyright © 2026 Cooklang

# RPM (and some other packagers) reject SPDX expressions with parens, WITH,
# and LicenseRef-. Override the license string passed to packaging metadata
# with a single identifier; full legal terms are in the bundled NOTICE.md
# and LICENSE-* files (see extraResources below).
extraMetadata:
  license: AGPL-3.0-only
# Do NOT set electronDist — it would pin to the host-arch Electron installed
# by npm and produce arm64 binaries even inside an x64 DMG. Let electron-
# builder resolve and download the correct-arch Electron per target.
electronVersion: 38.4.0
asar: true
asarUnpack:
  - "**/*.node"
  # Native *executables* invoked via child_process.spawn cannot run from
  # inside the asar archive. The bundled backend copies them into lib/**
  # (see @theia/native-webpack-plugin), where electron-builder's smart-unpack
  # does not reach (only node_modules are auto-unpacked). Unlike the *.node
  # addons above they are extensionless, so "**/*.node" misses them. Leaving
  # them packed silently breaks ripgrep-backed file search (report templates,
  # quick open, find-in-files), move-to-trash, and the terminal.
  - "**/backend/native/**"    # ripgrep `rg`
  - "**/backend/*trash*"      # trash helper (macos-trash / windows-trash.exe)
  - "**/prebuilds/**"         # node-pty `spawn-helper`
  - "**/build/Release/**"     # node-pty `spawn-helper` (alternate copy)
nodeGypRebuild: false
npmRebuild: false

directories:
  buildResources: resources

# node_modules and package.json are copied automatically by electron-builder.
# Theia apps need node_modules at runtime (src-gen requires packages from it).
# Exclude only source files and tests within node_modules to reduce size.
files:
  - src-gen
  - lib
  - proto
  - resources/icon-256.png
  - resources/cooked-logo.svg
  - "!node_modules/**/@theia/**/src/**"
  - "!node_modules/**/@theia/**/lib/**/*.spec.*"
  - "!node_modules/**/@theia/cooklang-native/target/**"
  - "!node_modules/**/@theia/cooklang-native/Cargo.*"
  - "!node_modules/**/@theia/cooklang-native/build.rs"
  - "!node_modules/**/@theia/cooklang-native/src/**"

extraResources:
  - from: ../plugins
    to: app/plugins
  - from: ../LICENSE-EPL
    to: licenses/LICENSE-EPL
  - from: ../LICENSE-GPL-2.0-ONLY-CLASSPATH-EXCEPTION
    to: licenses/LICENSE-GPL-2.0-ONLY-CLASSPATH-EXCEPTION
  - from: ../LICENSE-AGPL
    to: licenses/LICENSE-AGPL
  - from: ../LICENSES/cooklang-theia-linking-exception.txt
    to: licenses/cooklang-theia-linking-exception.txt
  - from: ../LICENSE-MIT.txt
    to: licenses/LICENSE-MIT.txt
  - from: ../LICENSE-vscode.txt
    to: licenses/LICENSE-vscode.txt
  - from: ../NOTICE.md
    to: licenses/NOTICE.md
  - from: resources/cooklang-mime.xml
    to: cooklang-mime.xml

publish:
  provider: github
  owner: cook-md
  repo: editor
  # release-please creates the GitHub Release first, flagged as a pre-release
  # (release-please-config.json prerelease: true). electron-builder's default
  # releaseType is "draft" and it refuses to upload into an existing release of
  # a different type ("existing type not compatible with publishing type"),
  # silently skipping every asset. A non-draft releaseType uploads into the
  # existing release; "prerelease" matches the alpha pre-release flag.
  releaseType: prerelease

# --- macOS ---
mac:
  icon: resources/icon.icns
  category: public.app-category.lifestyle
  darkModeSupport: true
  protocols:
    - name: cook
      schemes:
        - cook
  target:
    - dmg
    - zip
  # arch-suffix the zip too (dmg sets its own artifactName below); without it,
  # arm64 and x64 zips collide when published from the matrix.
  artifactName: Cook-Editor-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The Quick Look extension is embedded by after-pack.js and PRE-SIGNED (inside-out,
  # including its embedded CooklangParserFFI.framework, hardened runtime) by
  # macos/scripts/build-quicklook.sh in CI. @electron/osx-sign cannot sign a nested
  # .appex, so signIgnore tells electron-builder to leave it untouched; it still seals
  # the outer app over the already-signed appex, and notarization covers it.
  signIgnore:
    - "Contents/PlugIns/CookQuickLook.appex"
  # Submit to Apple's notarytool after signing; uses APPLE_* env vars.
  notarize: true
  # Custom file types for .cook / .menu. Conformance to public.plain-text lets
  # macOS Quick Look render the source on spacebar with no native extension.
  # The CFBundleDocumentTypes entries register Cook Editor as an Editor for them.
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Cooklang Recipe
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner
        LSItemContentTypes:
          - md.cook.editor.cook
      - CFBundleTypeName: Cooklang Menu
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner
        LSItemContentTypes:
          - md.cook.editor.menu
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: md.cook.editor.cook
        UTTypeDescription: Cooklang Recipe
        UTTypeConformsTo:
          - public.plain-text
        UTTypeTagSpecification:
          public.filename-extension:
            - cook
      - UTTypeIdentifier: md.cook.editor.menu
        UTTypeDescription: Cooklang Menu
        UTTypeConformsTo:
          - public.plain-text
        UTTypeTagSpecification:
          public.filename-extension:
            - menu

dmg:
  sign: true
  artifactName: Cook-Editor-${arch}.${ext}

# --- Windows ---
win:
  icon: resources/icon.ico
  target:
    - nsis
    - zip
  fileAssociations:
    - ext: cook
      name: Cooklang Recipe
      description: Cooklang Recipe
      icon: resources/icon.ico
    - ext: menu
      name: Cooklang Menu
      description: Cooklang Menu
      icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  artifactName: Cook-Editor-Setup.${ext}

# --- Linux ---
# rpm target is intentionally omitted: electron-builder/fpm wraps rpmbuild
# but does not surface its stderr, and rpmbuild rejects the spec generated
# from a productName containing a space ("Cook Editor"). AppImage + deb +
# tar.gz cover Fedora/RHEL users adequately for now.
linux:
  icon: resources/icon-256.png
  category: Utility
  target:
    - AppImage
    - deb
    - tar.gz
  fileAssociations:
    - ext: cook
      name: Cooklang Recipe
      description: Cooklang Recipe
      mimeType: text/x-cooklang
    - ext: menu
      name: Cooklang Menu
      description: Cooklang Menu
      mimeType: text/x-cooklang-menu

appImage:
  artifactName: Cook-Editor.${ext}

deb:
  artifactName: Cook-Editor.${ext}
  depends:
    - libnotify4
    - libxtst6
    - libnss3
  afterInstall: scripts/linux/deb-after-install.sh
  afterRemove: scripts/linux/deb-after-remove.sh

afterPack: ./scripts/after-pack.js
