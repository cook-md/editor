# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # ---- Rust ----
  - package-ecosystem: cargo
    directory: /packages/cooklang-native
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---- Node ----
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    ignore:
      # 4.1.5+ requires eslint ^9 || ^10; the repo is on eslint 8.
      - dependency-name: "eslint-plugin-no-unsanitized"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
