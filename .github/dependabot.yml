# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # ---- Rust ----
  - package-ecosystem: cargo
    directory: /packages/cooklang-native
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---- Node ----
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    ignore:
      # Hard fork of Theia: the workspace @theia/* packages are the source of
      # truth, never the upstream releases on npm.
      - dependency-name: "@theia/*"
      # 4.1.5+ requires eslint ^9 || ^10; the repo is on eslint 8.
      - dependency-name: "eslint-plugin-no-unsanitized"
      # Express 5 rejects the '*.ext' routes in backend-application.ts at
      # runtime; migrate deliberately rather than via a bump PR.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      # dev-packages/cli/patches/@lumino+widgets+<version>.patch is tied to the
      # exact version; port the patch when upgrading.
      - dependency-name: "@lumino/widgets"
      # 3.18 is exports-only and needs moduleResolution node16/bundler (base
      # tsconfig uses "Node") plus the vscode-jsonrpc 9 migration.
      - dependency-name: "vscode-languageserver-protocol"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # 0.4 is ESM-only with an import-only exports map; @theia/process
      # require()s it synchronously (ERR_PACKAGE_PATH_NOT_EXPORTED).
      - dependency-name: "string-argv"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
