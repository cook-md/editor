# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # ---- Rust ----
  - package-ecosystem: cargo
    directory: /packages/cooklang-native
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---- Node ----
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    ignore:
      # 4.1.5+ requires eslint ^9 || ^10; the repo is on eslint 8.
      - dependency-name: "eslint-plugin-no-unsanitized"
      # Pinned to the versions @theia/core 1.70 was built against; newer ones
      # break compilation (types/API changes) or the perfect-scrollbar override.
      - dependency-name: "perfect-scrollbar"
      - dependency-name: "@vscode/proxy-agent"
      - dependency-name: "vscode-languageserver-protocol"
      - dependency-name: "vscode-uri"
      - dependency-name: "@lumino/widgets"
      # 3.2.1+ ships its own types, which clash with @types/tar-stream.
      - dependency-name: "tar-stream"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
