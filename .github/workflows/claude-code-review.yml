name: Claude Code Review

on:
  pull_request:
    # Drafts are skipped below, so marking one ready is what first reviews it.
    types: [opened, synchronize, reopened, ready_for_review]

# Only the latest push to a pull request is worth a review; a newer one
# cancels the review still running for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # A draft is still being worked on, and every push to it would post a
    # fresh review comment. Review once it is marked ready instead.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # Dependabot-triggered runs read from the Dependabot secret store, not the
      # Actions one, so CLAUDE_CODE_OAUTH_TOKEN is empty there and the action
      # fails validation — a check that can never go green on a dependency PR,
      # which then blocks `@dependabot merge` forever. Fork PRs get no secrets
      # either, with the same result. Skip the review instead of failing it, and
      # say so in the run summary so a genuinely misconfigured token is still
      # visible. Adding CLAUDE_CODE_OAUTH_TOKEN to the repo's *Dependabot*
      # secrets is what turns the review back on for dependency PRs.
      - name: Check for review credentials
        id: creds
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not available to this run; skipping the review."
          fi

      - name: Checkout repository
        if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: steps.creds.outputs.available == 'true'
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        env:
          # Run subagents in the foreground. Claude Code backgrounds them by
          # default, and the action ends the run at the first result — which
          # is Claude saying it will wait for the plugin's first agent. Every
          # review then finished green in under a minute without reviewing or
          # posting anything. Remove once the action waits for background
          # tasks: https://github.com/anthropics/claude-code-action/issues/1852
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dependency bumps are exactly the PRs worth a second pair of eyes, but the
          # action refuses bot actors by default. Named explicitly rather than "*" so
          # a future App installed on this public repo cannot drive the review prompt.
          allowed_bots: "dependabot[bot]"
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The plugin reviews through sub-agents (a Haiku triage, parallel
          # Sonnet/Opus reviewers, validators). A Sonnet orchestrator skips
          # them and reports "no issues" within seconds, so the orchestrator is
          # Opus, and the tools the plugin's command grants itself are granted
          # to the sub-agents too. No `show_full_output`: this repo is public,
          # and the run log would publish the whole transcript.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
