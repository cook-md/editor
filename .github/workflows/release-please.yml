name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  # On every push to main, release-please maintains a "Release PR" that rolls up
  # conventional commits and bumps app/package.json. Merging that PR creates the
  # GitHub Release + v<version> tag and sets release_created=true, which gates
  # the build matrix below. Versioning is configured for alpha prereleases in
  # release-please-config.json (0.1.0-alpha.N → 0.1.0-alpha.N+1).
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT (RELEASE_TOKEN) lets the Release PR's checks run; falls back to
          # the built-in token, which still creates the PR/release.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # Build+publish when release-please just cut a release, or on a manual
    # workflow_dispatch (where the release-please job is skipped). `always()`
    # is required so a skipped dependency doesn't skip this job.
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-arm64
            electron_arch: arm64
            rust_target: aarch64-apple-darwin
          # Build x64 on a native Intel runner. `macos-15-intel` is the free
          # standard-runner replacement GitHub introduced when `macos-13` was
          # retired on 2025-12-08 (see GitHub changelog 2025-09-19). Native
          # x64 throughout sidesteps the cross-compile pain of arm64 runners
          # — optional-deps resolve correctly, prebuild-install fetches x64
          # `.node` files, theia rebuild:electron produces x64 binaries.
          - os: macos-15-intel
            platform: mac-x64
            electron_arch: x64
            rust_target: x86_64-apple-darwin
          # Pin to windows-2022 (VS 2022 / 17.x). `windows-latest` rolled to an
          # image shipping Visual Studio 2026 (v18), which the node-gyp@11.5.0
          # bundled with Node 22's npm can't detect ("unknown version undefined"),
          # breaking the native @theia/ffmpeg addon build during npm install.
          - os: windows-2022
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cooklang-language-server is referenced from packages/cooklang-native/Cargo.toml
      # as a sibling path (../../../cooklang-language-server). Place it next to the
      # editor checkout — actions/checkout rejects paths outside the workspace, so
      # use git clone directly.
      - name: Clone cooklang-language-server
        shell: bash
        run: |
          git clone --depth 1 https://github.com/cooklang/cooklang-language-server.git \
            "${{ github.workspace }}/../cooklang-language-server"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target (macOS cross-compile)
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cooklang-native/target
          key: ${{ runner.os }}-${{ matrix.rust_target || 'host' }}-cargo-${{ hashFiles('packages/cooklang-native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust_target || 'host' }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            dev-packages/*/node_modules
            app/node_modules
            # @theia/core's afterInstall generates re-export shims into
            # packages/*/shared — outside node_modules — that tsc requires.
            packages/*/shared
            # @theia/ffmpeg is a node-gyp workspace package; its native
            # addon is built into dev-packages/ffmpeg/build during npm
            # install. Without it, `theia rebuild:electron` crashes with
            # `Cannot find module '../build/Debug/ffmpeg.node'`.
            dev-packages/ffmpeg/build
          key: ${{ runner.os }}-${{ matrix.electron_arch || 'host' }}-nm-v3-${{ hashFiles('package-lock.json', 'lerna.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.electron_arch || 'host' }}-nm-v3-

      # native-keymap compiles against libx11/libxkbfile headers on Linux.
      - name: Install Linux native build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install
        env:
          # @vscode/ripgrep and other GitHub-release downloads hit anonymous
          # rate limits (403) without a token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On cache hit, npm install is skipped — but the root `postinstall`
      # (`theia-patch && compute-references && lerna run afterInstall`) never
      # runs. `afterInstall` in @theia/core regenerates re-export shims into
      # `packages/core/shared/`, which aren't part of node_modules and so
      # aren't preserved by the cache. Without them tsc fails with
      # `Cannot find module '@theia/core/shared/...'`. Re-run them here.
      - name: Regenerate Theia re-exports on cache hit
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        run: npx lerna run afterInstall

      - name: Cache TypeScript build
        uses: actions/cache@v4
        with:
          path: |
            packages/*/lib
            dev-packages/*/lib
            packages/*/*.tsbuildinfo
            dev-packages/*/*.tsbuildinfo
          key: ${{ runner.os }}-tsc-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsc-v1-

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ matrix.electron_arch || 'host' }}-eb-${{ hashFiles('app/electron-builder.yml', 'app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.electron_arch || 'host' }}-eb-

      # Cache resolved SwiftPM packages for the Quick Look appex, including the
      # downloaded CooklangParserFFI.xcframework (~26 MB). Without this, every
      # macOS build re-fetches it from GitHub release assets during xcodebuild;
      # a single stalled download previously hung the job for the full 6h budget
      # (release 0.1.0-alpha.25). Keyed on project.yml, which pins the version.
      - name: Cache SwiftPM packages (Quick Look, macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: macos/QuickLookExtension/build/SourcePackages
          key: ${{ runner.os }}-spm-quicklook-${{ hashFiles('macos/QuickLookExtension/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-quicklook-

      # cooklang-native git-depends on the private cook-md/db crates. Mint a
      # short-lived, repo-scoped GitHub App token (Contents: read on cook-md/db)
      # and rewrite the ssh URL to authenticated https so the
      # `--features nutrition` build can fetch them across all targets.
      # Requires DB_APP_ID + DB_APP_PRIVATE_KEY secrets on this repo.
      - name: Mint cook-md/db access token
        id: db_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DB_APP_ID }}
          private-key: ${{ secrets.DB_APP_PRIVATE_KEY }}
          owner: cook-md
          repositories: db

      - name: Configure git for private nutrition crates
        shell: bash
        env:
          DB_TOKEN: ${{ steps.db_token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${DB_TOKEN}@github.com/cook-md/db".insteadOf \
            "ssh://git@github.com/cook-md/db"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Build native addon
        working-directory: packages/cooklang-native
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            # Keep --features nutrition in sync with `npm run build` (package.json);
            # the cross-target path bypasses that script, so set the flag here too.
            npx napi build --release --platform --target ${{ matrix.rust_target }} --features nutrition
          else
            npm run build
          fi

      - name: Compile TypeScript
        run: npm run compile

      - name: Bundle Electron app
        working-directory: app
        run: npm run bundle
        env:
          # webpack hits the default 2 GB heap on Windows; give it room
          NODE_OPTIONS: --max-old-space-size=8192

      # Guard against silent feature drops in the generated frontend index.
      # `frontend` + `frontendElectron` in the same `theiaExtensions` entry
      # causes the generator to drop the `frontend` module on electron targets
      # (see packages/cooklang/package.json). This check catches that class of
      # regression before we ship a broken DMG.
      - name: Verify required frontend modules are registered
        working-directory: app
        shell: bash
        run: |
          INDEX=src-gen/frontend/index.js
          REQUIRED=(
            '@theia/cooklang/lib/browser/cooklang-frontend-module'
            '@theia/cooklang/lib/electron-browser/cooklang-electron-browser-module'
            '@theia/cooklang-account/lib/browser/cooklang-account-frontend-module'
            '@theia/cooklang-ai/lib/browser/cooklang-ai-frontend-module'
            '@theia/cooklang-branding/lib/browser/cooklang-branding-frontend-module'
          )
          missing=0
          for m in "${REQUIRED[@]}"; do
            if ! grep -qF "$m" "$INDEX"; then
              echo "::error::Missing frontend module: $m"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "::error::$INDEX is missing required frontend modules — check packages/*/package.json theiaExtensions entries"
            exit 1
          fi
          echo "All required frontend modules are registered."

      - name: Build & sign Quick Look extension (macOS)
        if: runner.os == 'macOS'
        # Hard backstop: the script bounds SwiftPM resolution itself, but cap the
        # whole step too so any unexpected hang (xcodebuild, keychain, codesign)
        # fails fast and re-runnable instead of consuming the 6h job budget.
        timeout-minutes: 25
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ql-signing.keychain-db"
          KPW="$(uuidgen)"
          CERT="$RUNNER_TEMP/ql-cert.p12"
          trap 'rm -f "$CERT"' EXIT

          # Import the Developer ID cert into a dedicated keychain so xcodebuild can sign
          # the appex (and its embedded framework) inside-out before electron-builder runs.
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$CERT"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null

          # Add our keychain to the search list for the build, remembering the originals.
          ORIG_KEYCHAINS=$(security list-keychains -d user | sed 's/[[:space:]"]//g')
          security list-keychains -d user -s "$KEYCHAIN" $ORIG_KEYCHAINS

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/{print $2; exit}')
          if [ -z "${IDENTITY:-}" ]; then echo "::error::No 'Developer ID Application' identity found in keychain"; exit 1; fi
          echo "Signing Quick Look appex with identity ${IDENTITY}"

          set +e
          QUICKLOOK_SIGN_IDENTITY="$IDENTITY" \
          QUICKLOOK_TEAM_ID="$APPLE_TEAM_ID" \
          QUICKLOOK_KEYCHAIN="$KEYCHAIN" \
            ./macos/scripts/build-quicklook.sh
          rc=$?
          set -e

          # Restore the original search list so electron-builder's later signing isn't
          # confused by two keychains holding the same identity (ambiguous match).
          security list-keychains -d user -s $ORIG_KEYCHAINS
          exit $rc

      - name: Package & Publish
        working-directory: app
        # Notarization round-trips to Apple can stall; bound the step so a hang
        # fails fast rather than eating the 6h job budget. Generous because
        # notarization legitimately takes a while.
        timeout-minutes: 60
        shell: bash
        run: |
          PUBLISH="${{ (needs.release-please.outputs.release_created == 'true' || github.event.inputs.publish == 'true') && 'always' || 'never' }}"
          if [ -n "${{ matrix.electron_arch }}" ]; then
            npx electron-builder --mac --${{ matrix.electron_arch }} --publish "$PUBLISH"
          else
            npx electron-builder --publish "$PUBLISH"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing — electron-builder reads these automatically on macOS.
          # Harmless on Windows/Linux matrix rows (ignored).
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Notarization — electron-builder reads these when mac.notarize is true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Guard against silently shipping a macOS build without the Quick Look
      # extension (regression: after-pack early-returned before the embed block,
      # so no build contained Contents/PlugIns/CookQuickLook.appex).
      - name: Verify Quick Look extension embedded (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        shell: bash
        run: |
          APP=$(find dist -maxdepth 2 -name 'Cook Editor.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::packaged 'Cook Editor.app' not found under app/dist"; exit 1
          fi
          APPEX="$APP/Contents/PlugIns/CookQuickLook.appex"
          if [ ! -x "$APPEX/Contents/MacOS/CookQuickLook" ]; then
            echo "::error::Quick Look extension missing at $APPEX — after-pack embed did not run"; exit 1
          fi
          echo "Quick Look extension embedded: $APPEX"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cook-Editor-${{ matrix.platform }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.rpm
            app/dist/*.tar.gz
            app/dist/*.yml
          if-no-files-found: warn
