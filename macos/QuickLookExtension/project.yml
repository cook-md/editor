name: CookQuickLook
options:
  bundleIdPrefix: md.cook.editor
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

packages:
  # cooklang-rs is consumed as a LOCAL package prepared by build-quicklook.sh: it
  # curls the CooklangParserFFI xcframework and patches out cooklang-rs's remote
  # binaryTarget, because that GitHub-release-asset download intermittently stalls
  # and hangs xcodebuild/SwiftPM (which have no download timeout) in CI. The script
  # parses the version from the comment below — keep it in sync when bumping.
  # cooklang-rs-version: 0.18.7
  CooklangParser:
    path: build/cooklang-rs

targets:
  CookQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: md.cook.editor.quicklook
        PRODUCT_NAME: CookQuickLook
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        # REQUIRED for PlugInKit to register the QL preview extension (sandbox).
        CODE_SIGN_ENTITLEMENTS: ../../build/entitlements.quicklook.plist
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: CooklangParser
        product: CooklangParser

  CookQuickLookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Sources/Formatting.swift
      - path: Sources/RecipePreviewModel.swift
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - package: CooklangParser
        product: CooklangParser
    settings:
      base:
        SWIFT_VERSION: "5.9"
